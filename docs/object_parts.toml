inventory_pages = [176, 177]
inventory_source = "S3 pages 176-177 — the only pages with no step numeral"
transcription = """
Hand-transcribed from the two inventory renders. Quantities and part numbers are
read off the page; no quantity is inferred. The transcription is cross-checked
against the callout extraction where both cover the same part — see
[[crosschecks]] below."""

