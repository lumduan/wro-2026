# any model. An unnamed slot beats a coin-flip between two part numbers.

# --------------------------------------------------------------------------- #
# Known limitations of the silhouette method, found 2026-07-27
# --------------------------------------------------------------------------- #

[limitations.silhouette_cannot_see_interior_detail]
found = "2026-07-27, during Phase 7 part 1"
symptom = """
Shape group 1 was labelled `technic_brick_1x6` (3894). Its renders actually mix
plain 1x6 bricks (pages 2, 105, 110, 153) with Technic 1x6 bricks (pages 104,
126). Page 110's callout has no holes at all."""
cause = """
3009 Brick 1x6 and 3894 Technic Brick 1x6 have IDENTICAL outer dimensions. The
Technic holes are interior detail. A silhouette match compares outlines, so it
cannot separate two parts that differ only inside their outline. The +/-8 px
window and the 0.95 agreement threshold are irrelevant here — no threshold
separates shapes that are genuinely the same shape."""
also_the_reverse = """
The same root cause split ONE part into two groups: cluster 5 (239x161) and
cluster 15 (241x185) are both plain 1x6 bricks drawn from different camera
angles. Interior detail is invisible and viewing angle is over-weighted."""
dimensional_impact = "NONE"
dimensional_impact_note = """
Every extent derived through these groups is unaffected, because the confusable
parts are the same size. The clef's 4x6 base and the speaker's 4x6 base are both
still correct; only the sentence naming WHICH 1x6 was wrong. Corrected by
withdrawing the claim: both entries now carry lego_id_candidates rather than a
single asserted id."""
what_would_resolve_it = """
Count the interior hole rings, not the outline. On a 3894 the side face carries
5 ring outlines; on a 3009 it carries none. That is a different detector from
the one built in part 2 and was not needed for any dimension, so it is recorded
as available rather than built."""
