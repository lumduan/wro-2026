# object_parts.toml — S3 part renders → LEGO parts (Phase 4 part 3, judgement layer)
#
# Two independent sources are reconciled here:
#
#   1. the per-step parts CALLOUTS (pages 2-175), segmented into individual
#      part renders and grouped by silhouette by tools/s3_callouts.py
#   2. the parts INVENTORY on pages 176-177, which lists every element with its
#      canonical LEGO part number, colour and total quantity
#
# The inventory is the authority on WHAT a part is; the callouts are the
# authority on WHERE it is used. Neither is guessed from the other.
#
# `studs`, where given, is CROSS-CHECKED against the extraction: the builder
# hard-fails if a curated count disagrees with a self-checked detected one.

