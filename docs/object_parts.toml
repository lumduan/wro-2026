# object_parts.toml — cluster ID → LEGO part (Phase 4 part 2, judgement layer)
#
# tools/s3_callouts.py groups the 152 parts-callouts in S3 into 45 distinct
# renders. This file names the ones that matter and records how they were read.
#
# `studs`, where given, is CROSS-CHECKED against the extraction: the builder
# hard-fails if a curated count disagrees with the detected one.
#
# COVERAGE IS PARTIAL AND DELIBERATELY SO. Automatic stud counting works on
# LIGHT parts, where the stud ellipses are drawn black on white and segment
# cleanly (10 of 45 clusters, lattice self-check rows*cols == studs). On
# coloured parts the stud tops differ from the body by only ~5 luminance units
# — blue body (1,80,199) vs stud (0,74,191) — so flood fill merges them and the
# count is unreliable. Those clusters are left unnamed rather than guessed.

[[parts]]
cluster_id = 4
part = "plate_4x8"
studs = 32
lattice = [4, 8]
colour = "white"
evidence = """
424x303 px callout, quantity 1x, appearing on pages 18, 27, 35, 42, 49, 57, 67,
115 — the SECOND step of all six notes plus mic and guitar, and nowhere else.
32 stud centres detected; isometric lattice fit gives 4 x 8 = 32 cells, an exact
self-consistency check. Identical render on all eight, which turns S1 p5's 'the
bases of the notes are all the same' into a measurement."""

