# object_map.toml — S3 page ranges → canonical object IDs (Phase 4, part 3)
#
# The hand-curated judgement layer for data/object_spec.json, mirroring the split
# that worked for S5: this file says WHICH pages build WHICH object and on what
# evidence; the builder derives every number.
#
# STATUS: COMPLETE. All 16 objects in the frozen CLAUDE.md 5.3 table are mapped
# to a page range. There are no unresolved spans. Six page ranges are recorded
# as sub-assemblies rather than objects; see [[subassemblies]].
#
# Part 1 and part 2 derived boundaries from the light-blue parts callout. Part 3
# replaces that with the cream RUN-PREVIEW box, which is the signal S3 actually
# provides for this. Every range below was re-derived, not patched — and three
# of part 1's were wrong. The superseded values are kept in [superseded].

[meta]
source = "S3 — WRO-2026-RM-Elementary-BI-All.pdf"
source_sha256 = "ab7fa33bcae102d800bcc390e1155125c07c1fdcdf06d55df1e8ea38d166bd7a"
build_step_pages = "2..175"
inventory_pages = "176..177"
stud_pitch_mm = 8.0      # S4 7.4: elements are WRO Brick Set 45811/45819 => LEGO System
plate_mm = 3.2
brick_mm = 9.6

# --------------------------------------------------------------------------- #
# MEASURED(S3): 174 build steps on pages 2..175; 176-177 are the parts inventory
# --------------------------------------------------------------------------- #
[structure]
step_numbering = "continuous"
step_of_page = "step = page - 1"
resets = false
steps = 174
first_step_page = 2
last_step_page = 175
boundary_signal = "cream RUN-PREVIEW box, background (255,245,218), 20 pages"
boundary_evidence = """
A flat-colour census over every build page returns exactly TWO box backgrounds:
the light-blue parts callout (215,238,254) and the cream run preview
(255,245,218). Every other flat colour is brick paint. The cream box appears on
20 pages, always anchored at y = 98, and partitions pages 2..175 into 20 runs
with no gap and no overlap.

The preview CONTENTS are the identification evidence: page 26's is the finished
blue note, page 102's the finished congas, page 153's the finished speaker.
That is what makes this signal usable where the callout was not."""
boundary_caveat = """
A run is not always a model. Six previews mark a SUB-ASSEMBLY built inside a
larger model — page 73 sits inside the microphone, pages 130/132/138/140 inside
the amplifier, page 96 inside the keyboard. Distinguishing the two is a
judgement call and lives here, not in the tool. The decisive evidence in each
case is recorded on the model entry."""

# --------------------------------------------------------------------------- #
# What part 1 got wrong, kept on the record
# --------------------------------------------------------------------------- #
[superseded]
step_count = """
Part 1 recorded "step numbering is continuous 1..176, one step per page, pages
2..177", verified by a digit census reading 9 one-digit, 90 two-digit and 77
three-digit numerals. The three-digit bucket is 75, not 77: pages 176 and 177
are the parts INVENTORY and carry no step numeral at all, and the census counted
their "24x" / "3003" labels instead. 9 + 90 + 75 = 174 steps on pages 2..175."""
instrument_guitar = """
Part 1 recorded pages 114-123. Page 124 (step 123) still shows the guitar
mid-build — red body, yellow neck, white plate — and the next run preview is at
126. The guitar is 114-125."""
cable = """
Part 1 recorded pages 167-172. The last run preview is at 167 with none after,
so the run continues to the end of the build steps: 167-175."""
mic = """
Part 1 recorded pages 66-72 and left 73-88 unresolved. Page 72 shows the
microphone column still WITHOUT its black head; page 88 shows the same column
capped. The 73-88 run is a sub-assembly inside the microphone build."""
instrument_keyboard = """
Part 1 recorded pages 89-95 and left 96-101 unresolved. Page 101 shows the
assembled keyboard — four black key-bars on a white body — so the run continues
to 101 and the page-96 preview is a sub-assembly inside it."""
unresolved_spans = """
All three of part 1's unresolved spans are resolved: 73-88 is inside the
microphone, 96-101 inside the keyboard, and 124-166 splits into the tail of the
guitar (124-125), the amplifier (126-152) and the two speakers (153-166)."""

