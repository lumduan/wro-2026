# object_map.toml — S3 page ranges → canonical object IDs (Phase 4, part 1)
#
# The hand-curated judgement layer for data/object_spec.json, mirroring the split
# that worked for S5: this file says WHICH pages build WHICH object and on what
# evidence; the builder derives every number.
#
# STATUS: page mapping and identification are DONE. Per-object DIMENSIONS are NOT
# yet in this file -- see the "dimension source" note below for why the planned
# method was rejected after testing it.

[meta]
source = "S3 — WRO-2026-RM-Elementary-BI-All.pdf"
source_sha256 = "ab7fa33bcae102d800bcc390e1155125c07c1fdcdf06d55df1e8ea38d166bd7a"
build_pages = "2..177"
stud_pitch_mm = 8.0      # S4 7.4: elements are WRO Brick Set 45811/45819 => LEGO System
plate_mm = 3.2
brick_mm = 9.6

# --------------------------------------------------------------------------- #
# MEASURED(S3): the step numbering is CONTINUOUS, 1..176, one step per page
# --------------------------------------------------------------------------- #
# Page N carries step N-1, with no per-model reset. Verified by digit count:
# 9 pages with a 1-digit numeral (steps 1-9), 90 with 2 digits (10-99) and 77
# with 3 digits (100-176) -- an exact match for pages 2..177.
#
# This killed the planned primary boundary signal. The plan assumed the step
# number resets to 1 at each model; it does not. Recorded so nobody re-derives
# the same dead end.
[structure]
step_numbering = "continuous"
step_of_page = "step = page - 1"
resets = false
boundary_signal = "top-right callout box (31 pages carry one)"
boundary_caveat = """
A callout marks a model start for the first 13 models, whose runs are 6-16 steps.
From page 124 on, callouts also mark sub-assemblies and parts lists, producing
1-2 step 'models' that are not models. Those runs are NOT treated as objects."""

# --------------------------------------------------------------------------- #
