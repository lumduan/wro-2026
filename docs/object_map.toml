# --------------------------------------------------------------------------- #
# Dimension source — the planned method was tested and REJECTED
# --------------------------------------------------------------------------- #
[dimensions]
status = "done_for_9_of_13"
planned_method = "count studs on the base in the assembly render"
rejected_because = """
Tested on note_blue's final step (page 33). The base is PARTLY OCCLUDED by the
object's own body: the isometric lattice fit recovered only 10 stud centres, in
two disjoint groups either side of the column. That admits several plate sizes,
and the note footprint carries 120 of 255 points."""
method_used = """
The PER-STEP PARTS CALLOUTS instead - each step draws its part unoccluded in a
light-blue box. tools/s3_callouts.py groups the 152 callouts into 45 distinct
renders; the base comes from each model's FIRST step, where nothing is yet
stacked on it."""
automatic_stud_count_coverage = """
The lattice self-check (rows*cols == detected studs) passes on 10 of 45 clusters,
all LIGHT-coloured parts where stud ellipses are black on white. On coloured
parts the stud top differs from the body by ~5 luminance units - blue body
(1,80,199) vs stud (0,74,191) - so flood fill merges them. Those clusters are
left unnamed in object_parts.toml rather than guessed. The cluster that matters
most, the 4x8 plate, is white and self-checks exactly: 32 studs, 4x8."""

# --------------------------------------------------------------------------- #
# CONTACT vs PROJECTION - the finding that settles A7
# --------------------------------------------------------------------------- #
#   step n     2x (2x4 brick)  -> a 4x4 core          <- THIS touches the mat
#   step n+1   1x (4x8 plate)  -> ON TOP of the core   <- overhangs at +9.6 mm
#   step n+2   2x (2x4 brick)  -> stacked on the plate
[a7_measurement]
supersedes = "the [a7_inference] block below, kept for the record"
note_target_mm = 79.699
note_contact_footprint_studs = [4, 4]
note_contact_footprint_mm = [32.0, 32.0]
note_max_projection_studs = [4, 8]
note_max_projection_mm = [32.0, 64.0]
overhang_height_mm = 9.6
slack_per_side_contact_mm = 23.85
slack_per_side_projection_mm = 7.85
confidence = "MEASURED(S3)"
cross_check = """
S2's note start square measures 31.9 mm; the contact patch derives to 32.0 mm
from the stud count. Two independent sources agreeing to 0.1 mm - and it shows
the start square is sized to the note's CONTACT patch, not its silhouette."""
verdict = """
A7's containment default holds under EITHER reading: 23.85 mm of slack per side
if 'touching' means the contact patch, 7.85 mm if a judge uses the silhouette.
Both are positive, so nothing is blocked. Which one the scorer uses is a scoring
INTERPRETATION question, not an arithmetic one, so both are recorded.

Part 1 inferred 4x4 from the mat and reported 23.85 mm. Mid-analysis I read the
4x8 plate as the base and 'corrected' this to 7.85 mm; that was the error, caught
by following the build sequence through pages 17-19 before it was committed."""


[a7_inference]
note_target_mm = 79.699        # MEASURED(S2), the #4e5252 outer square
note_target_studs = 9.96       # 79.699 / 8.0 -> exactly 10 studs (79.700 mm)
note_start_square_mm = 31.9    # MEASURED(S2), the #a0d187 randomised start squares
note_start_square_studs = 3.99 # 31.9 / 8.0 -> exactly 4 studs (32.0 mm)
inferred_note_base_studs = 4
inferred_slack_per_side_mm = 23.85   # (79.699 - 32.0) / 2
confidence = "inference, NOT a measurement"
reasoning = """
The mat's own note start square is exactly 4 studs and the note target exactly 10.
A start square is sized to the object that stands on it, so the note base is very
likely 4x4 studs = 32.0 mm, which matches the 4x4 core built at step 25. If so the
containment slack is 23.85 mm per side and A7's default is comfortably achievable.
This is inferred from S2 geometry, NOT measured from S3, and must be confirmed by
the parts-callout pass or by calipers before anything depends on the exact value."""
