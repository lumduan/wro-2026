# --------------------------------------------------------------------------- #
# UNRESOLVED — recorded as unresolved rather than force-fitted
# --------------------------------------------------------------------------- #
# Same discipline as unassigned_marker_{1..4} in ADR-012: a wrong semantic in a
# derived spec is read forward by every module without question.

[[unresolved]]
pages = [73, 88]
steps = [72, 87]
callout = "small white brick assembly marked '2x'"
candidates = ["speaker_a", "speaker_b", "amp", "sub_assembly"]
note = "16 steps is long for a sub-assembly, and '2x' fits the two speakers — but the callout does not resemble a speaker. Needs the parts-callout pass."

[[unresolved]]
pages = [96, 101]
steps = [95, 100]
callout = "white/grey body, black top, three round dials"
candidates = ["amp"]
note = "Dials strongly suggest an amplifier, but S1 p6 places the amp on the stage with the speakers and this has not been cross-checked against S1's photo."

[[unresolved]]
pages = [124, 166]
steps = [123, 165]
callout = "mixed: parts lists, black sub-assemblies, a dense black grid (p126), a blue block marked '2x' (p153)"
candidates = ["speaker_a", "speaker_b", "amp", "sub_assemblies"]
note = "This span contains the remaining objects plus many sub-assembly callouts. The p126 dense black grid reads as a speaker grille and p153's '2x' fits a pair, but neither is confirmed."

# --------------------------------------------------------------------------- #
# Dimension source — the planned method was tested and REJECTED
# --------------------------------------------------------------------------- #
[dimensions]
status = "pending"
planned_method = "count studs on the base in the assembly render"
rejected_because = """
Tested on note_blue's final step (page 33). The base plate is PARTLY OCCLUDED by
the object's own body: fitting the isometric stud lattice (u = +49.6,+24.7 px and
v = -49.6,+24.7 px per stud, |u| = 55.4 px) recovered only 10 stud centres, in two
disjoint groups either side of the blue column, spanning lattice j from -7 to +1
with the middle hidden. That admits several plate sizes, and the note footprint
carries 120 of 255 points. A number that cannot be read reliably is not recorded."""
replacement_method = """
Read the PER-STEP PARTS CALLOUTS instead. Every step names its part and quantity
('2x' of a 2x4 brick), drawn unoccluded and axis-aligned in a callout box. Summing
them across a model's page range gives an exact bill of materials, from which
dimensions follow without counting studs on an occluded render."""

# --------------------------------------------------------------------------- #
# A7 — a cross-source INFERENCE, explicitly not a measurement of the object
# --------------------------------------------------------------------------- #
[a7_inference]
note_target_mm = 79.699        # MEASURED(S2), the #4e5252 outer square
note_target_studs = 9.96       # 79.699 / 8.0 -> exactly 10 studs (79.700 mm)
note_start_square_mm = 31.9    # MEASURED(S2), the #a0d187 randomised start squares
note_start_square_studs = 3.99 # 31.9 / 8.0 -> exactly 4 studs (32.0 mm)
inferred_note_base_studs = 4
inferred_slack_per_side_mm = 23.85   # (79.699 - 32.0) / 2
confidence = "inference, NOT a measurement"
reasoning = """
The mat's own note start square is exactly 4 studs and the note target exactly 10.
A start square is sized to the object that stands on it, so the note base is very
likely 4x4 studs = 32.0 mm, which matches the 4x4 core built at step 25. If so the
containment slack is 23.85 mm per side and A7's default is comfortably achievable.
This is inferred from S2 geometry, NOT measured from S3, and must be confirmed by
the parts-callout pass or by calipers before anything depends on the exact value."""
