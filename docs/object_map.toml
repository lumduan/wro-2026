# --------------------------------------------------------------------------- #
# Dimension source — the method, and what it does and does not reach
# --------------------------------------------------------------------------- #
[dimensions]
status = "complete_for_every_object_the_scorer_needs"
planned_method = "count studs on the base in the assembly render"
rejected_because = """
Tested on note_blue's final step (page 33). The base is PARTLY OCCLUDED by the
object's own body: the isometric lattice fit recovered only 10 stud centres, in
two disjoint groups either side of the column. That admits several plate sizes,
and the note footprint carries 120 of 255 points."""
method_used = """
The PER-STEP PARTS CALLOUTS instead — each step draws its part unoccluded in a
light-blue box — plus the PARTS INVENTORY on pages 176-177, which gives every
element its canonical LEGO part number and total quantity. The base comes from
each model's FIRST step, where nothing is yet stacked on it."""
stud_count_coverage = """
Part renders are segmented individually before fitting (a callout may hold two
or three parts; page 89's fits 14 stud centres to a 5x9 = 45-cell lattice, which
cannot self-check until the parts are split). After splitting, the direct
lattice self-check passes on 14 of 58 part renders. Silhouette shape-transfer
carries those counts to renders of the same part in different paint, reaching
33 of 58. The remaining 25 are named from the inventory instead, or left
unnamed."""
shape_transfer_calibration = """
The transfer window is calibrated, not chosen. Over all 58 renders, every pair
that falls inside the +/-8 px shape window AND self-checks its own lattice
agrees on both stud count and lattice — 31 of 31 pairs, zero conflicts.
Genuinely different shapes score 0.66-0.74 agreement against 0.9552 for the
worst same-part pair. The builder raises rather than guesses if a group ever
disagrees with itself.

Independent check: the transfer says the step-1 part of note_black, note_green,
note_red and the guitar is a 2x4 brick in each object's colour. Part 2 derived
the same thing from the BUILD SEQUENCE on pages 17/18/19, by a completely
different route, and the inventory lists 3001 Brick 2x4 in exactly those
colours."""

# --------------------------------------------------------------------------- #
# What the scorer actually needs — not every object needs a footprint
# --------------------------------------------------------------------------- #
[scoring_relevance]
source = "S1 3.1-3.4 and the scoring summary"
needs_containment = ["note_red", "note_blue", "note_green", "note_yellow",
                     "note_white", "note_black", "mic", "instrument_guitar",
                     "instrument_keyboard", "instrument_congas",
                     "cable_upper", "cable_lower"]
scored_by_not_moving = ["clef", "amp", "speaker_a", "speaker_b"]
note = """
S1 scores the clef, the amplifier and the two speakers as 'not damaged or
moved' — 10, 10 and 20 points for LEAVING THEM ALONE. Their footprint is
therefore not on the scorer's containment path at all, and a missing footprint
for the amp or a speaker blocks nothing. This is why part 3 spends its
measurement effort on the cables, keyboard and congas instead."""

[congas_pair_extent]
per_drum_contact_studs = [4, 4]
per_drum_contact_mm = [32.0, 32.0]
pieces = 1
pieces_evidence = """
MEASURED(S3) 2026-07-27, upgrading part 3's silence on this. The two drums are
ONE rigid object, not two. Step 103 (page 104) places 2x a black Technic Brick
1x6 (3894) side by side as a 2x6 bridge spanning BOTH drums; page 112 shows the
same bar still joining them in the finished model. So the congas is a single
pick-up, and there are 12 pick-ups for the 12 placement objects, not 13."""
pair_separation = "NOT MEASURED — but now BOUNDED, see below"
long_extent_bound_studs = 14
long_extent_bound_mm = 112.0
bound_derivation = """
A rigorous upper bound from part lengths, not a measurement. The bridge is 6
studs long and joins two 4-stud drums, so the outer-to-outer span cannot exceed
4 + 6 + 4 = 14 studs = 112.0 mm. It is certainly less — page 104 shows the bridge
overlapping both drums rather than butting between them — but by how much is not
derivable from an isometric render.

The lattice fit was tried on page 104, which is the best case available: the
assembly lies flat with its top face fully visible and nothing stacked on it. It
returned 21 stud centres in a 13 x 5 extent and FAILED its rows x cols
self-check, because the assembly is an irregular outline rather than a filled
rectangle. Recorded so the next pass does not retry it expecting a different
answer."""
blocks_nothing_because = """
The congas score under 'Instrument completely in backstage area'. The backstage
area measures 393.809 x 317.219 mm (MEASURED(S2), data/field_spec.json). Even at
the 112.0 mm bound the containment margin exceeds 140 mm per side, so no scoring
outcome depends on closing this. What DOES depend on it is the manipulator: the
bound is the grip span the congas demands, and that is why the bound is worth
recording even though the exact value is not."""

# --------------------------------------------------------------------------- #
# CABLE ORIENTATION — a hard constraint that falls out of the measurement
# --------------------------------------------------------------------------- #
[cable_orientation]
cable_length_mm = 128.0
cable_length_studs = 16
cable_width_mm = 16.0
area_short_axis_mm = 79.700
area_long_axis_mm = 207.201
area_angle_upper_deg = 80.0
area_angle_lower_deg = 100.0
areas_are_axis_aligned = false
fits_along_long_axis = true
fits_across_short_axis = false
slack_per_end_along_long_axis_mm = 39.600
slack_per_side_across_short_axis_mm = 31.850
binding_slack_mm = 31.850
deficit_across_short_axis_mm = -48.300
confidence = "MEASURED(S3) x MEASURED(S2)"
finding = """
The cable is 128.0 mm long (2x Technic Brick 1x16). Each grey cable area is a
79.700 x 207.201 mm rectangle — and it is TILTED: cable_area_upper's long axis
lies at 80 deg, cable_area_lower's at 100 deg. They mirror each other about the
horizontal.

128.0 > 79.700, so the cable cannot lie across its area's short axis: it is
48.300 mm too long. The placement orientation is FORCED, and the two cables need
DIFFERENT, mirrored headings — a robot that places both identically gets one
wrong. Worth 30 points (15 per cable, 'completely in the grey area and upright'),
and it constrains the manipulator, not just the strategy: the gripper must be
able to set yaw, and to set it to two different values."""

[cable_orientation.correction_2026_07_27]
supersedes = "the figures committed in ab07e75 (Phase 4 part 3)"
was = """
area_x_extent_mm = 114.47, area_y_extent_mm = 217.89, slack 44.94 per end,
deficit -13.53, and the cable laid along the mat's Y axis."""
now = """
The area is 79.700 x 207.201 mm at 80/100 deg. Slack 39.600 per end along its
long axis, 31.850 per side across, deficit -48.300, and the cable laid at
-10 deg (upper) / +10 deg (lower) in the object frame."""
root_cause = """
bbox_mm was read as though it were the area. It is not: for a ROTATED rectangle
the axis-aligned bounding box is strictly larger. 114.47 x 217.89 is the bbox;
the area is 79.700 x 207.201. Every other scoring area happens to be
axis-aligned, so the substitution is invisible on nine of ten areas and wrong on
the tenth.

The data said so and was not read: field_spec records area_mm2 = 16513.822 for
cable_area_upper, against a bounding-box area of 24941.9 mm2 — a 34% gap that
only a rotated shape produces. The roadmap ALSO already recorded the cable area
as 2.5 x 6.5 design units = 79.75 x 207.35 mm, which agrees with the polygon and
contradicts the bbox reading. Two independent records were right and the derived
number was wrong, because it came from a convenience field rather than the
geometry."""
guard = """
sim/geometry.min_area_rect recovers a rectangle's own axes, and the scorer aims
every placement using it. tests/test_scoring.py asserts that the cable areas are
NOT axis-aligned, so this specific substitution cannot silently return."""
direction_of_error = """
The conclusion survives and strengthens: the orientation was already called
forced, and the true deficit is 48.3 mm rather than 13.5 mm. But the slack was
OVERSTATED (44.94 against 31.85 binding), which is the dangerous direction for a
tolerance figure, and the required mirrored headings were missed entirely."""

# --------------------------------------------------------------------------- #
# CONTACT vs PROJECTION - the finding that settles A7
# --------------------------------------------------------------------------- #
#   step n     2x (2x4 brick)  -> a 4x4 core          <- THIS touches the mat
#   step n+1   1x (4x8 plate)  -> ON TOP of the core   <- overhangs at +9.6 mm
#   step n+2   2x (2x4 brick)  -> stacked on the plate
[a7_measurement]
supersedes = "the [a7_inference] block below, kept for the record"
note_target_mm = 79.699
note_contact_footprint_studs = [4, 4]
note_contact_footprint_mm = [32.0, 32.0]
note_max_projection_studs = [4, 8]
note_max_projection_mm = [32.0, 64.0]
overhang_height_mm = 9.6
slack_per_side_contact_mm = 23.85
slack_per_side_projection_mm = 7.85
confidence = "MEASURED(S3)"
cross_check = """
S2's note start square measures 31.9 mm; the contact patch derives to 32.0 mm
from the stud count. Two independent sources agreeing to 0.1 mm - and it shows
the start square is sized to the note's CONTACT patch, not its silhouette.

Part 3 adds a third: the inventory on page 176 lists 8x 3035 White Plate 4x8,
and the callout extraction finds that plate on exactly 8 pages — the second step
of the six notes plus mic and guitar."""
verdict = """
A7's containment default holds under EITHER reading: 23.85 mm of slack per side
if 'touching' means the contact patch, 7.85 mm if a judge uses the silhouette.
Both are positive, so nothing is blocked. Which one the scorer uses is a scoring
INTERPRETATION question, not an arithmetic one, so both are recorded.

Part 1 inferred 4x4 from the mat and reported 23.85 mm. Mid-analysis I read the
4x8 plate as the base and 'corrected' this to 7.85 mm; that was the error, caught
by following the build sequence through pages 17-19 before it was committed."""


[a7_inference]
note_target_mm = 79.699        # MEASURED(S2), the #4e5252 outer square
